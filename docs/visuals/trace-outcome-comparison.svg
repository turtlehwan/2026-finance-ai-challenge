<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <rect width="1400" height="700" rx="36" fill="#F6F3EC"/>
  <text x="72" y="82" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" fill="#142B3A">답변 전에는 멈추고, 답변 후에는 같은 사건을 다시 검증합니다</text>
  <text x="72" y="126" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" fill="#51606A">현재 구현은 체크포인트 재개가 아니라, 답변을 포함한 두 번째 전체 그래프 호출입니다.</text>
  <rect x="72" y="184" width="1256" height="124" rx="26" fill="#FFFFFF" stroke="#D6B25E" stroke-width="3"/>
  <rect x="94" y="206" width="176" height="80" rx="20" fill="#FFF0D6"/>
  <text x="182" y="255" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="800" fill="#995109">첫 실행</text>
  <text x="320" y="232" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#51606A">답변 없음</text>
  <text x="320" y="270" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="26" font-weight="800" fill="#142B3A">Information Gate → Human Review → 종료</text>
  <rect x="1078" y="209" width="220" height="74" rx="20" fill="#FFF8E8" stroke="#D97706" stroke-width="2"/>
  <text x="1188" y="254" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="800" fill="#995109">결과 미확정</text>
  <rect x="72" y="332" width="1256" height="124" rx="26" fill="#FFFFFF" stroke="#1D5B4F" stroke-width="3"/>
  <rect x="94" y="354" width="176" height="80" rx="20" fill="#E6EFEA"/>
  <text x="182" y="403" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="800" fill="#1D5B4F">두 번째 호출</text>
  <text x="320" y="380" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#51606A">답변 포함</text>
  <text x="320" y="418" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="26" font-weight="800" fill="#142B3A">전체 그래프 재실행 → 근거 감사 → 다음 행동</text>
  <rect x="1078" y="357" width="220" height="74" rx="20" fill="#EDF6F2" stroke="#1D5B4F" stroke-width="2"/>
  <text x="1188" y="402" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="800" fill="#1D5B4F">제한 결과 제공</text>
  <rect x="72" y="480" width="1256" height="124" rx="26" fill="#FFFFFF" stroke="#9A3E2F" stroke-width="3"/>
  <rect x="94" y="502" width="176" height="80" rx="20" fill="#F7E6E1"/>
  <text x="182" y="551" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="800" fill="#9A3E2F">실패 경로</text>
  <text x="320" y="528" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#51606A">지원 밖 버전·필수 근거 누락</text>
  <text x="320" y="566" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="26" font-weight="800" fill="#142B3A">근거 감사 실패 → 안전 중단 → 공식 문의</text>
  <rect x="1078" y="505" width="220" height="74" rx="20" fill="#FBEEEA" stroke="#9A3E2F" stroke-width="2"/>
  <text x="1188" y="550" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="800" fill="#9A3E2F">확인 불가</text>
</svg>
