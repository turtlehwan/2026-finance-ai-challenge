  <text x="72" y="82" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" fill="#142B3A">지급 문장 하나가 아니라, 필수 근거 5유형을 함께 확인합니다</text>
