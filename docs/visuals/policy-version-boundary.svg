<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <rect width="1400" height="700" rx="36" fill="#F6F3EC"/>
  <text x="72" y="82" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" fill="#142B3A">같은 치료라도 가입일이 다르면 확인할 약관이 달라집니다</text>
  <text x="72" y="126" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" fill="#51606A">상품코드와 계약일을 먼저 고정한 뒤, 해당 버전의 조항과 쪽수만 사용합니다.</text>
  <line x1="120" y1="330" x2="1280" y2="330" stroke="#A9B3B8" stroke-width="8" stroke-linecap="round"/>
  <line x1="700" y1="250" x2="700" y2="410" stroke="#D97706" stroke-width="8"/>
  <rect x="120" y="205" width="440" height="210" rx="28" fill="#FFFFFF" stroke="#1D5B4F" stroke-width="4"/>
  <text x="158" y="258" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#1D5B4F">P400051~P400054</text>
  <text x="158" y="310" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="800" fill="#142B3A">2112 약관</text>
  <text x="158" y="354" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" fill="#51606A">2021.12.01 — 2025.04.02</text>
  <text x="158" y="394" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" fill="#51606A">지급 p.491 · 정의 p.495</text>
  <rect x="840" y="205" width="440" height="210" rx="28" fill="#FFFFFF" stroke="#173F67" stroke-width="4"/>
  <text x="878" y="258" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#173F67">P400073~P400076</text>
  <text x="878" y="310" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="800" fill="#142B3A">2504 약관</text>
  <text x="878" y="354" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" fill="#51606A">2025.04.03 — 2025.06.04</text>
  <text x="878" y="394" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" fill="#51606A">지급 p.497 · 정의 p.501</text>
  <rect x="572" y="448" width="256" height="76" rx="38" fill="#FFF0D6" stroke="#D97706" stroke-width="3"/>
  <text x="700" y="496" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="800" fill="#995109">계약일 경계</text>
  <rect x="72" y="576" width="1256" height="64" rx="18" fill="#E6EFEA"/>
  <text x="700" y="617" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" fill="#1D5B4F">검색보다 먼저 버전을 확정해야, 같은 S52 골절에도 맞는 근거를 제시할 수 있습니다.</text>
</svg>
