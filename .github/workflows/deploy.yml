name: Deploy to Cloudflare

# main = 배포된 것. 리뷰 게이트는 PR에 있으므로 여기서 다시 승인받지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 나중 것이 이긴다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

  deploy:
    name: Deploy worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://finai26.turtlehwan.dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build worker
        run: npm run build

      # 정본 도메인은 Cloudflare 인프라에서 이 Worker에 한 번 연결한다. CI는
      # Zone route 권한 없이 새 Worker version을 업로드하고 100% 트래픽으로
      # 승격한다. 따라서 public workflow에는 domain 변경 권한이 필요 없다.
      - name: Prepare code-only deploy config
        run: node .github/scripts/prepare-cloudflare-deploy.mjs

      - name: Upload and promote Worker version
        run: |
          set -euo pipefail
          deploy_log="$(mktemp)"
          npx wrangler deploy --config wrangler.json 2>&1 | tee "$deploy_log"
          version_id="$(sed -nE 's/.*Current Version ID: ([0-9a-f-]+).*/\1/p' "$deploy_log" | tail -n 1)"
          test -n "$version_id"
          npx wrangler versions deploy "${version_id}@100%" --name insurance-claim-guide-agent --yes
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
