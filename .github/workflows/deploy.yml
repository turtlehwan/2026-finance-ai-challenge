name: Deploy to Cloudflare

# main = 배포된 것. 리뷰 게이트는 PR에 있으므로 여기서 다시 승인받지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 나중 것이 이긴다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

  deploy:
    name: Deploy worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://finai26.turtlehwan.dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build worker
        run: npm run build

      # vinext가 생성한 Wrangler 설정을 사용해 Worker 버전과 finai26 custom
      # domain trigger를 같은 배포로 반영한다. `wrangler deploy`를 dist/server에서
      # 직접 실행하면 route가 빠진 별도 설정을 사용할 수 있어 정본 도메인이
      # 이전 Worker를 가리킬 위험이 있다.
      # 인증값은 GitHub Environment Secret으로만 주입한다.
      - name: Deploy
        run: npm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
