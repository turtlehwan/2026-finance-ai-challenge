name: Deploy to Cloudflare

# main = 배포된 것. 리뷰 게이트는 PR에 있으므로 여기서 다시 승인받지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 나중 것이 이긴다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

  deploy:
    name: Deploy worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://finai26.turtlehwan.dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build worker
        run: npm run build

      # 커스텀 도메인은 이미 Cloudflare에 연결되어 있다. 매 배포 때 라우트를
      # 다시 쓰지 않아 배포 토큰을 Worker 코드 업로드 권한으로 제한한다.
      - name: Prepare least-privilege deploy config
        run: node .github/scripts/prepare-cloudflare-deploy.mjs

      # wrangler가 두 값을 환경변수로 읽으므로 저장소에는 아무것도 남기지 않는다.
      - name: Deploy
        run: npx wrangler deploy --config wrangler.json
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
